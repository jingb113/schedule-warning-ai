<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工期预警管控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #003B7A 0%, #005AAF 50%, #0074D9 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .upload-section {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .plan-status {
            background: white;
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        
        .plan-status-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .plan-status-icon {
            font-size: 28px;
        }
        
        .plan-status-text {
            flex: 1;
        }
        
        .plan-status-title {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 3px;
        }
        
        .plan-status-desc {
            font-size: 13px;
            color: #6b7280;
        }
        
        .plan-status-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #005AAF 0%, #003B7A 100%);
            color: white;
            transition: all 0.2s;
        }
        
        .plan-status-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 90, 175, 0.4);
        }
        
        .plan-status-btn.secondary {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .plan-status-btn.secondary:hover {
            background: #e5e7eb;
            box-shadow: none;
        }
        
        .plan-status.configured {
            border-left: 4px solid #10b981;
        }
        
        .plan-status.configured .plan-status-btn {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .upload-box {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .upload-box:hover {
            border-color: #005AAF;
            background: #e8f0fa;
            transform: translateY(-2px);
        }
        
        .upload-box.has-file {
            border-color: #10b981;
            background: #f0fdf4;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        .upload-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 13px;
            color: #999;
        }
        
        .upload-filename {
            font-size: 14px;
            color: #10b981;
            font-weight: 500;
            margin-top: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn-compare {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #005AAF 0%, #003B7A 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 59, 122, 0.4);
        }
        
        .btn-compare:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 59, 122, 0.6);
        }
        
        .btn-compare:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #666;
        }
        
        .stat-card.red .stat-number { color: #ef4444; }
        .stat-card.yellow .stat-number { color: #f59e0b; }
        .stat-card.green .stat-number { color: #10b981; }
        .stat-card.total .stat-number { color: #005AAF; }
        
        .email-status {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .email-icon {
            font-size: 32px;
        }
        
        .email-content {
            flex: 1;
        }
        
        .email-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .email-desc {
            font-size: 13px;
            color: #666;
        }
        
        .email-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .email-badge.sent {
            background: #f0fdf4;
            color: #10b981;
        }
        
        .table-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .table-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1f2937;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            border-bottom: 2px solid #e5e7eb;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .badge.red {
            background: #fee2e2;
            color: #ef4444;
        }
        
        .badge.yellow {
            background: #fef3c7;
            color: #f59e0b;
        }
        
        .badge.green {
            background: #f0fdf4;
            color: #10b981;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #005AAF;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #ef4444;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .upload-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>工期预警管控系统</h1>
            <p>自动比对进度计划与日报，生成预警报表并发送邮件</p>
        </div>
        
        <!-- 进度计划配置状态 -->
        <div class="plan-status" id="planStatus">
            <div class="plan-status-content">
                <span class="plan-status-icon">⚙️</span>
                <div class="plan-status-text">
                    <div class="plan-status-title">进度计划</div>
                    <div class="plan-status-desc" id="planStatusDesc">尚未配置，请上传进度计划文件</div>
                </div>
                <button class="plan-status-btn" id="btnUploadPlan">上传</button>
                <button class="plan-status-btn secondary" id="btnReuploadPlan" style="display: none;">重新上传</button>
            </div>
            <input type="file" id="planFile" accept=".xlsx,.xls" style="display: none;">
        </div>
        
        <!-- 日报上传区域 -->
        <div class="upload-section" id="dailySection" style="display: none;">
            <div class="upload-box" id="dailyBox">
                <div class="upload-icon">📄</div>
                <div class="upload-label">上传项目日报</div>
                <div class="upload-hint">点击或拖拽文件到此处</div>
                <div class="upload-filename" id="dailyFilename"></div>
                <input type="file" id="dailyFile" accept=".xlsx,.xls">
            </div>
            
            <button class="btn-compare" id="btnCompare" disabled>开始比对分析</button>
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: white; font-size: 16px;">正在进行比对分析，请稍候...</p>
        </div>
        
        <div class="result-section" id="resultSection">
            <div class="stats-grid">
                <div class="stat-card red">
                    <div class="stat-number" id="redCount">0</div>
                    <div class="stat-label">红色预警</div>
                </div>
                <div class="stat-card yellow">
                    <div class="stat-number" id="yellowCount">0</div>
                    <div class="stat-label">黄色预警</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-number" id="greenCount">0</div>
                    <div class="stat-label">正常</div>
                </div>
                <div class="stat-card total">
                    <div class="stat-number" id="totalCount">0</div>
                    <div class="stat-label">总任务数</div>
                </div>
            </div>
            
            <div class="email-status" id="emailStatus">
                <div class="email-icon">📧</div>
                <div class="email-content">
                    <div class="email-title">邮件发送状态</div>
                    <div class="email-desc" id="emailDesc">预警邮件已发送</div>
                </div>
                <div class="email-badge sent" id="emailBadge">已发送</div>
            </div>
            
            <div class="table-section">
                <div class="table-title">三大主任务汇总比对</div>
                <table id="summaryTable">
                    <thead>
                        <tr>
                            <th>日报工作项</th>
                            <th>进度计划任务</th>
                            <th>计划完成%</th>
                            <th>实际完成%</th>
                            <th>偏差</th>
                            <th>预警等级</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div class="table-section">
                <div class="table-title">子任务时间偏差明细</div>
                <table id="subtaskTable">
                    <thead>
                        <tr>
                            <th>所属主任务</th>
                            <th>区段</th>
                            <th>子任务名称</th>
                            <th>状态</th>
                            <th>完成%</th>
                            <th>延迟天数</th>
                            <th>时间预警</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        let planConfigured = false;
        let dailyFileSelected = null;
        
        // 页面加载时检查进度计划状态
        async function checkPlanStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.plan.uploaded) {
                    planConfigured = true;
                    document.getElementById('planStatus').classList.add('configured');
                    document.getElementById('planStatusDesc').textContent = 
                        `已配置 (${data.plan.upload_time})`;
                    document.getElementById('btnUploadPlan').style.display = 'none';
                    document.getElementById('btnReuploadPlan').style.display = 'inline-block';
                    document.getElementById('dailySection').style.display = 'block';
                } else {
                    planConfigured = false;
                    document.getElementById('planStatus').classList.remove('configured');
                    document.getElementById('planStatusDesc').textContent = 
                        '尚未配置，请上传进度计划文件';
                    document.getElementById('btnUploadPlan').style.display = 'inline-block';
                    document.getElementById('btnReuploadPlan').style.display = 'none';
                    document.getElementById('dailySection').style.display = 'none';
                }
            } catch (error) {
                console.error('检查进度计划状态失败:', error);
            }
        }
        
        // 上传进度计划按钮
        document.getElementById('btnUploadPlan').addEventListener('click', () => {
            document.getElementById('planFile').click();
        });
        
        document.getElementById('btnReuploadPlan').addEventListener('click', () => {
            document.getElementById('planFile').click();
        });
        
        // 进度计划文件选择处理
        document.getElementById('planFile').addEventListener('change', async (e) => {
            if (e.target.files.length === 0) return;
            
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('plan_file', file);
            
            try {
                const response = await fetch('/api/upload_plan', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    planConfigured = true;
                    document.getElementById('planStatus').classList.add('configured');
                    document.getElementById('planStatusDesc').textContent = 
                        `已配置 (${new Date().toLocaleString('zh-CN', {
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit'
                        })})`;
                    document.getElementById('btnUploadPlan').style.display = 'none';
                    document.getElementById('btnReuploadPlan').style.display = 'inline-block';
                    document.getElementById('dailySection').style.display = 'block';
                    
                    alert('进度计划配置成功！');
                } else {
                    alert('上传失败: ' + data.error);
                }
            } catch (error) {
                alert('上传失败，请检查网络连接');
            }
        });
        
        // 日报文件上传交互
        function setupDailyUploadBox() {
            const box = document.getElementById('dailyBox');
            const input = document.getElementById('dailyFile');
            const filename = document.getElementById('dailyFilename');
            
            box.addEventListener('click', () => input.click());
            
            box.addEventListener('dragover', (e) => {
                e.preventDefault();
                box.style.borderColor = '#005AAF';
                box.style.background = '#e8f0fa';
            });
            
            box.addEventListener('dragleave', () => {
                box.style.borderColor = '#ddd';
                box.style.background = '#f8f9fa';
            });
            
            box.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    input.files = files;
                    handleDailyFileSelect();
                }
            });
            
            input.addEventListener('change', () => {
                handleDailyFileSelect();
            });
        }
        
        function handleDailyFileSelect() {
            const input = document.getElementById('dailyFile');
            const filename = document.getElementById('dailyFilename');
            const box = document.getElementById('dailyBox');
            
            if (input.files.length > 0) {
                const file = input.files[0];
                filename.textContent = file.name;
                box.classList.add('has-file');
                dailyFileSelected = file;
                updateCompareButton();
            }
        }
        
        function updateCompareButton() {
            const btn = document.getElementById('btnCompare');
            btn.disabled = !(planConfigured && dailyFileSelected);
        }
        
        // 初始化
        checkPlanStatus();
        setupDailyUploadBox();
        
        // 比对按钮点击
        document.getElementById('btnCompare').addEventListener('click', async () => {
            const btn = document.getElementById('btnCompare');
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const errorMessage = document.getElementById('errorMessage');
            
            // 隐藏之前的结果和错误
            resultSection.style.display = 'none';
            errorMessage.classList.remove('show');
            
            // 显示加载状态
            btn.disabled = true;
            loading.classList.add('show');
            
            try {
                const formData = new FormData();
                formData.append('daily_file', dailyFileSelected);
                
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    body: formData
                });
                
                // 区分网络层错误和业务层错误
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error(`服务器返回非JSON (HTTP ${response.status}): ${text.substring(0, 100)}`);
                }
                
                loading.classList.remove('show');
                
                if (data.success) {
                    displayResults(data);
                } else {
                    showError(data.error || '比对失败，请检查文件格式');
                }
            } catch (error) {
                loading.classList.remove('show');
                console.error('比对请求异常:', error);
                showError(`请求失败: ${error.message || error}`);
            } finally {
                btn.disabled = false;
                updateCompareButton();
            }
        });
        
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 5000);
        }
        
        function displayResults(data) {
            const resultSection = document.getElementById('resultSection');
            
            // 更新统计数据
            document.getElementById('redCount').textContent = data.stats.summary_counts.red;
            document.getElementById('yellowCount').textContent = data.stats.summary_counts.yellow;
            document.getElementById('greenCount').textContent = data.stats.summary_counts.green;
            document.getElementById('totalCount').textContent = data.summary.length;
            
            // 更新邮件状态
            const emailBadge = document.getElementById('emailBadge');
            const emailDesc = document.getElementById('emailDesc');
            if (data.email_sent) {
                emailBadge.textContent = '已发送';
                emailBadge.className = 'email-badge sent';
                const to = (data.email_recipients || []).join(', ');
                emailDesc.textContent = to ? ('预警邮件已成功发送至 ' + to) : '预警邮件已成功发送';
            } else if (!(data.email_recipients || []).length) {
                emailBadge.textContent = '未发送';
                emailBadge.className = 'email-badge failed';
                emailDesc.textContent = '未配置邮件环境变量（SMTP_USER / SMTP_PASS / EMAIL_RECIPIENTS），仅生成报表';
            } else {
                emailBadge.textContent = '发送失败';
                emailBadge.className = 'email-badge failed';
                emailDesc.textContent = '邮件发送失败，请检查网络连接';
            }
            
            // 更新汇总表格
            const summaryTable = document.getElementById('summaryTable').querySelector('tbody');
            summaryTable.innerHTML = data.summary.map(row => `
                <tr>
                    <td>${row.daily_name}</td>
                    <td>${row.plan_name}</td>
                    <td>${row.plan_pct.toFixed(1)}%</td>
                    <td>${row.actual_pct.toFixed(1)}%</td>
                    <td style="color: ${row.deviation < 0 ? '#ef4444' : '#10b981'}">
                        ${row.deviation > 0 ? '+' : ''}${row.deviation.toFixed(1)}%
                    </td>
                    <td><span class="badge ${getLevelClass(row.level)}">${row.level}</span></td>
                </tr>
            `).join('');
            
            // 更新子任务表格
            const subtaskTable = document.getElementById('subtaskTable').querySelector('tbody');
            subtaskTable.innerHTML = data.subtasks.map(st => `
                <tr>
                    <td>${st.category}</td>
                    <td>${st.block}</td>
                    <td>${st.name}</td>
                    <td>${st.status}</td>
                    <td>${st.pct}%</td>
                    <td style="color: ${st.end_delay > 0 ? '#ef4444' : '#6b7280'}">
                        ${st.end_delay !== null ? st.end_delay + '天' : '-'}
                    </td>
                    <td><span class="badge ${getLevelClass(st.time_warning)}">${st.time_warning}</span></td>
                </tr>
            `).join('');
            
            // 显示结果区域
            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        function getLevelClass(level) {
            if (level === '红色') return 'red';
            if (level === '黄色') return 'yellow';
            if (level === '绿色') return 'green';
            return '';
        }
    </script>
</body>
</html>
